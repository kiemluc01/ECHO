services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: echo
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
    ports:
      - "55432:5432"
    volumes:
      - echo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  echo-postgres:
